<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harttance</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Spectral+SC:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
             --card-bg: #080808;
            --muted-color: #888888;
            --border-color: #1a1a1a;
            --accent-color: #ffffff; /* Warna cahaya saat hover */
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Inter', sans-serif;
            --transition-speed: 2s;
            --transition-ease: cubic-bezier(0.22, 1, 0.36, 1);
            --transition: 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            padding-bottom: 100px;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Animasi Awal (State Sebelum Muncul) */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity var(--transition-speed) var(--transition-ease), 
                        transform var(--transition-speed) var(--transition-ease);
        }

        /* State Setelah Muncul */
        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 60px;
        }

        nav {
            padding: 60px 0;
            display: flex;
            justify-content: flex-start;
            gap: 40px;
            align-items: center;
        }

        .logo {
          font-family: "Spectral SC", serif;
           font-size: 2rem;
            letter-spacing: 2px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: 300;
        }
        
        .spectral-sc-light {
  font-family: "Spectral SC", serif;
  font-weight: 750;
  font-style: normal;
}

        header {
            padding: 100px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 15px;
        }

        header h1 {
            font-family: var(--font-serif);
            font-size: clamp(1.7rem, 5vw, 4rem);
            font-weight: 300;
            line-height: 1.1;
            margin-bottom: 2px;
            max-width: 900px;
            max-height: 60px;
        }
        
        .spacer-lg {
    height: 2500px; /* Jarak yang sangat lebar */
}
        
        .portfolio-container { 
          max-width: 800px;
          margin: 0 auto; 
          
        }

        /* --- MODERN PORTFOLIO BOX --- */
        .portfolio-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 50px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 6rem;
        }

          .portfolio-box:hover {
            transform: translateY(-10px);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Label kecil di pojok (Modern Touch) */
        .box-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--muted-color);
            margin-bottom: 20px;
            display: block;
        }
 .portfolio-box h2 {
            font-family: var(--font-sans);;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 300;
            line-height: 1;
            margin-bottom: auto; /* Mendorong list ke bawah */
            padding-bottom: 40px;
        }

        .asset-list {
            display: flex;
            align-items: center;
            gap: 30px;
            flex-wrap: wrap;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .asset-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--text-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .asset-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .asset-icon img { width: 100%; height: 100%; object-fit: cover; }

        .venture-logo {
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 3px;
            color: white;
            opacity: 0.6;
            transition: var(--transition);
        }

        .portfolio-box:hover .venture-logo { opacity: 1; }
      

        @media (max-width: 768px) {
            .wrapper { padding: 0 30px; }
            header h1 { font-size: 2rem; }
            .portfolio-box { padding: 40px 30px; }
            .spacer-md { height: 50px; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <nav class="reveal">
            <a href="#" class="logo">Harttance</a>
        </nav>

        <header class="reveal">
            <h1>AN INVESTMENT COMPANY FOCUSED ON LIQUID ASSETS AND THE TECHNOLOGY SECTOR.</h1>
        </header>
        
        <div class="spacer-lg"></div>

        <div class="portfolio-container">
            <div class="portfolio-box reveal">
                <div>
                    <span class="box-label">01 / INVESMENT</span>
                    <h2>Liquid Asset</h2>
                </div>
                <div class="asset-list">
                    <div class="asset-item">
                        <div class="asset-icon"><img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png?v=029" alt="BTC"></div>
                        Bitcoin
                    </div>
                    <div class="asset-item">
                        <div class="asset-icon"><img src="https://cryptologos.cc/logos/solana-sol-logo.png?v=029" alt="SOL"></div>
                        SOLANA
                    </div>
                </div>
            </div>

    <script>



        const observerOptions = { threshold: 0.15 };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('active');
                }
            });
        }, observerOptions);
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        






        
    </script>

</body>
</html>
